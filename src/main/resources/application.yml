server:
  port: 8080

spring:
  application:
    name: delivery-route-optimizer
  mvc:
    async:
      request-timeout: 30000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  routing:
    exact-threshold: 7
    average-speed-kmph: 20.0

logging:
  level:
    com.lucidity: DEBUG
    root: INFO
